name: Validate PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-registry:
    name: Validate registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run registry validation
        id: validate
        run: |
          python3 .github/scripts/validate_registry.py \
            --output-file /tmp/registry-comment.md
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run claude plugin validate
        id: plugin-validate
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude plugin validate . 2>&1 | tee /tmp/plugin-validate.txt
        continue-on-error: true

      - name: Append plugin validate output
        run: |
          {
            echo ""
            echo "### \`claude plugin validate\`"
            echo ""
            echo '```'
            cat /tmp/plugin-validate.txt 2>/dev/null || echo "(not available in this environment)"
            echo '```'
          } >> /tmp/registry-comment.md

      - name: Post or update validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- claude-registry-validation -->';
            let body;
            try {
              body = fs.readFileSync('/tmp/registry-comment.md', 'utf8');
            } catch {
              body = `${marker}\n## Registry validation\n\nCould not read validation output.`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if validation errors found
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Registry validation failed. See the PR comment for details."
          exit 1
