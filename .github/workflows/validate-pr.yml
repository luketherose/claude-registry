name: Validate PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Job names are load-bearing: the "Protect main branch" ruleset requires the
# status-check contexts "Validate marketplace" and "Validate catalog". Renaming
# a job here silently blocks every pull request, because a required context
# that never reports stays pending forever. Change the ruleset first.

jobs:
  validate-marketplace:
    name: Validate marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate marketplace.json and every plugin.json
        id: validate
        run: |
          python3 .github/scripts/validate_registry.py \
            --only manifests \
            --output-file /tmp/marketplace-comment.md
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A real gate. The previous version swallowed the exit code with `|| echo`
      # and the failure step below keyed only on the Python validator, so a
      # plugin that Claude Code itself rejects still produced a green check.
      # A non-zero exit only blocks when the CLI actually reports a validation
      # failure; an unavailable or unauthenticated CLI is reported, not enforced.
      - name: Run claude plugin validate
        id: cli_validate
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          set +e
          out=$(claude plugin validate . 2>&1)
          rc=$?
          set -e
          verdict="passed"
          if [ "$rc" -ne 0 ]; then
            if echo "$out" | grep -qi "validation failed"; then
              verdict="FAILED"
            else
              verdict="could not run (not a validation failure, not enforced)"
              rc=0
            fi
          fi
          {
            echo ""
            echo "### \`claude plugin validate\` — $verdict"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >> /tmp/marketplace-comment.md
          exit $rc
        continue-on-error: true

      - name: Post or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- claude-registry-validation-manifests -->';
            let body;
            try {
              body = fs.readFileSync('/tmp/marketplace-comment.md', 'utf8');
            } catch {
              body = `${marker}\n## Marketplace validation\n\nCould not read validation output.`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if manifest errors found
        if: steps.validate.outcome == 'failure' || steps.cli_validate.outcome == 'failure'
        run: |
          echo "Marketplace validation failed. See the PR comment for details."
          exit 1

  validate-catalog:
    name: Validate catalog
    runs-on: ubuntu-latest
    needs: validate-marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate agents, skills, references and the description budget
        id: validate
        run: |
          python3 .github/scripts/validate_registry.py \
            --only capabilities \
            --output-file /tmp/catalog-comment.md
        continue-on-error: true

      - name: Safety hook regression matrix
        run: bash hooks/tests/test-pre-tool-safety.sh

      - name: Post or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- claude-registry-validation-capabilities -->';
            let body;
            try {
              body = fs.readFileSync('/tmp/catalog-comment.md', 'utf8');
            } catch {
              body = `${marker}\n## Catalog validation\n\nCould not read validation output.`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if capability errors found
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Catalog validation failed. See the PR comment for details."
          exit 1
